<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurar Vital Sun</title>
<style>body{font-family:sans-serif;background:#FFFBF5;padding:20px}textarea{width:100%;height:200px}button{background:#1a1a1a;color:white;padding:12px 20px;border-radius:30px;border:none;font-weight:bold;margin:10px 0}</style>
</head>
<body>
<h2>🔄 Restaurar Datos Vital Sun</h2>
<p>1. Si llegaste desde GitHub Pages, pega abajo el JSON gigante que exportaste</p>
<p>O si ya estás en file://, toca Exportar Viejo primero</p>
<textarea id="input"></textarea><br>
<button onclick="importar()">📥 IMPORTAR EN ESTE SITIO (github.io)</button>
<button onclick="exportar()">📤 EXPORTAR DE ESTE SITIO</button>
<pre id="log"></pre>
<script>
function exportar(){
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k.startsWith('vitalSun')){try{data[k]=JSON.parse(localStorage.getItem(k))}catch(e){data[k]=localStorage.getItem(k)}}}
  const out={_vitalSunMigration:true, exportedAt:new Date().toISOString(), origin:location.href, totalKeys:Object.keys(data).length, data};
  document.getElementById('input').value=JSON.stringify(out);
  document.getElementById('log').textContent='Exportado '+Object.keys(data).length+' claves. Copia el texto de arriba';
}
function importar(){
  try{
    const txt=document.getElementById('input').value.trim();
    if(!txt){alert('Pega tu JSON primero');return;}
    const backup=JSON.parse(txt);
    const src=backup.data||backup;
    let c=0;
    Object.entries(src).forEach(([k,v])=>{
      localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v));
      c++;
    });
    document.getElementById('log').textContent='✅ Importado '+c+' bloques. Redirigiendo a la app...';
    setTimeout(()=>{location.href='./';},1500);
  }catch(e){alert('Error: '+e.message); document.getElementById('log').textContent=e.stack}
}
</script>
</body>
</html>
