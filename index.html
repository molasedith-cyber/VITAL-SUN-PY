function log(m){document.getElementById('log').textContent+=m+"\n"; console.log(m);}

function reparar(){
  log("Borrando datos viejos...");
  // Borrar solo claves vitalSun
  Object.keys(localStorage).forEach(k=>{ if(k.startsWith('vitalSun')) localStorage.removeItem(k); });
  log("Instalando 89 clientas...");
  let count=0;
  Object.entries(BACKUP.data).forEach(([k,v])=>{
    try{
      const val = typeof v==='string'? v : JSON.stringify(v);
      localStorage.setItem(k,val);
      count++;
    }catch(e){ log("Error "+k+": "+e); }
  });
  log("✅ Instalados "+count+" bloques");
  log("Claves: "+Object.keys(BACKUP.data).join(", ").slice(0,200));
  // Verificar una muestra
  try{
    const sample = JSON.parse(localStorage.getItem('vitalSun_appointments_v5')||'[]');
    log("Muestra v5: "+sample.length+" citas");
    if(sample[0]) log("Primera cita cliente="+ (sample[0].cliente||'NO TIENE CLIENTE') +" - datos: "+JSON.stringify(sample[0]).slice(0,150));
  }catch(e){ log("Error leyendo muestra: "+e); }
  render();
  alert("✅ ¡Reparado! Ahora deberías ver los nombres abajo");
}

function limpiarTodo(){
  localStorage.clear();
  log("Todo borrado. Tocá REPARAR AHORA");
  render();
}

function getCitas(){
  let citas=[];
  try{
    const raw=localStorage.getItem('vitalSun_appointments_v5');
    if(raw){
      const arr=JSON.parse(raw);
      if(Array.isArray(arr)) citas=arr;
    }
  }catch(e){}
  if(citas.length===0){
    // buscar cualquier otro
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k.startsWith('vitalSun')) continue;
      try{
        const v=JSON.parse(localStorage.getItem(k));
        if(Array.isArray(v) && v[0] && v[0].cliente && v.length>citas.length) citas=v;
      }catch{}
    }
  }
  return citas;
}

function render(){
  const citas=getCitas();
  const q=(document.getElementById('buscador').value||'').toLowerCase();
  const filtradas=citas.filter(c=> (c.cliente||'').toLowerCase().includes(q));
  const grid=document.getElementById('grid');
  if(citas.length===0){
    grid.innerHTML='<div class="client">No hay citas. Tocá REPARAR ARRIBA.</div>'; return;
  }
  grid.innerHTML=filtradas.slice(0,100).map(c=>{
    return `<div class="client"><b>${c.cliente||'Sin nombre'}</b><br><small>${c.fecha} ${c.inicio} ${c.tratamiento} ${c.duracion}min</small><br><small style="color:#666">ID:${c.id}</small></div>`;
  }).join('') + `<div class="client" style="background:#E8F5E9"><b>Total: ${filtradas.length} / ${citas.length}</b></div>`;
}
render();
