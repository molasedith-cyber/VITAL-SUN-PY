<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Restaurar Vital Sun V2</title>
<style>body{font-family:sans-serif;background:#FFFBF5;padding:20px;max-width:700px;margin:auto}textarea{width:100%;height:250px;border:2px solid #E8DDD0;border-radius:12px;padding:12px;font-family:monospace;font-size:11px}button{background:#1a1a1a;color:white;padding:14px 24px;border-radius:30px;border:none;font-weight:bold;margin:10px 0;width:100%;font-size:14px}button:active{transform:scale(0.98)}.ok{background:#e8f5e9;color:#2e7d32;padding:12px;border-radius:10px;margin-top:10px;display:none}.err{background:#fbe9e7;color:#c62828;padding:12px;border-radius:10px;margin-top:10px;display:none}</style>
</head>
<body>
<h2>🔄 Restaurar Vital Sun V2</h2>
<p>Pegá tu JSON gigante abajo. Si pegaste de más, lo arreglo automático.</p>
<textarea id="input" placeholder="Pega aquí el JSON que empieza con {&quot;_vitalSunMigration&quot;..."></textarea>
<button onclick="importar()">📥 IMPORTAR EN ESTE SITIO</button>
<button onclick="exportar()" style="background:white;color:#1a1a1a;border:2px solid #E8DDD0">📤 EXPORTAR DE ESTE SITIO</button>
<div id="ok" class="ok"></div>
<div id="err" class="err"></div>
<pre id="log" style="white-space:pre-wrap;font-size:11px;margin-top:15px"></pre>
<script>
function exportar(){
  const data={};
  for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i); if(k.startsWith('vitalSun')){try{data[k]=JSON.parse(localStorage.getItem(k))}catch(e){data[k]=localStorage.getItem(k)}}}
  const out={_vitalSunMigration:true, exportedAt:new Date().toISOString(), origin:location.href, totalKeys:Object.keys(data).length, data};
  document.getElementById('input').value=JSON.stringify(out);
  document.getElementById('log').textContent='Exportado '+Object.keys(data).length+' claves. Copia el texto de arriba';
}
function safeParse(text){
  text=text.trim();
  // Si pegó 2 JSON pegados, quedate solo con el primero completo balanceando llaves
  try{return JSON.parse(text);}catch(e){
    // Intenta encontrar donde termina el primer JSON válido
    const msg=e.message;
    const m=msg.match(/position (\d+)/);
    if(m){
      const pos=parseInt(m[1],10);
      // Cortar hasta pos y probar
      try{return JSON.parse(text.slice(0,pos));}catch(e2){}
    }
    // Último intento: buscar primer objeto balanceado
    let depth=0, start=text.indexOf('{');
    for(let i=start;i<text.length;i++){
      const ch=text[i];
      if(ch==='{')depth++; else if(ch==='}')depth--;
      if(depth===0 && i>start){try{return JSON.parse(text.slice(start,i+1));}catch(_){}}
    }
    throw e;
  }
}
function importar(){
  const ok=document.getElementById('ok'); const err=document.getElementById('err'); const log=document.getElementById('log');
  ok.style.display='none'; err.style.display='none';
  try{
    let txt=document.getElementById('input').value.trim();
    if(!txt){alert('Pega tu JSON primero');return;}
    // Si viene con texto extra antes/después, extrae el JSON
    const firstBrace=txt.indexOf('{'); const lastBrace=txt.lastIndexOf('}');
    if(firstBrace>0 || lastBrace < txt.length-1){
      txt=txt.slice(firstBrace, lastBrace+1);
    }
    const backup=safeParse(txt);
    const src=backup.data||backup;
    let c=0;
    Object.entries(src).forEach(([k,v])=>{
      if(!k.startsWith('vitalSun')) return;
      localStorage.setItem(k, typeof v==='string'?v:JSON.stringify(v));
      c++;
    });
    ok.style.display='block';
    ok.textContent='✅ Importado '+c+' bloques. Clientes: '+(src['vitalSun_v3_clientes']?JSON.stringify(src['vitalSun_v3_clientes']).length+' chars':'')+' - Redirigiendo a la app en 2 seg...';
    log.textContent='Claves: '+Object.keys(src).join(', ');
    setTimeout(()=>{location.href='./';},2000);
  }catch(e){
    err.style.display='block';
    err.textContent='Error: '+e.message;
    log.textContent=e.stack;
  }
}
</script>
</body>
</html>
